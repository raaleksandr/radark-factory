<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>radark cockpit</title>
<!-- One self-contained page (owner-cockpit D7): no CDN, no external font, no build step. Every text from a hub is
     escaped before the minimal Markdown subset is applied; links only to http(s) targets. -->
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #dde1e8; --accent: #2f5bd3;
  --accent-text: #ffffff; --warn-bg: #fff4e0; --warn: #8a4b00; --err-bg: #fdeaea; --err: #a11c1c; --ok: #1d7a3a;
  --chip: #eef1f6; --esc-bg: #ffe5e0; --esc: #b3261e; --code: #f0f2f5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --panel: #1d2128; --text: #e6e9ef; --muted: #9aa3b2; --line: #2e343e; --accent: #7aa2ff;
    --accent-text: #0f1420; --warn-bg: #3a2c12; --warn: #f3c27a; --err-bg: #3d1d1d; --err: #ff9b9b; --ok: #7fd49a;
    --chip: #272c35; --esc-bg: #4a211d; --esc: #ffb4a8; --code: #262b33;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 18px; padding: 10px 22px; flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
nav { display: flex; gap: 4px; }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; color: var(--muted);
  font: inherit; cursor: pointer; }
nav button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
nav button:disabled { cursor: default; opacity: .6; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
button.btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.btn:disabled { opacity: .5; cursor: default; }
main { max-width: 1060px; margin: 0 auto; padding: 18px 22px 60px; }
.tab { display: none; } .tab.active { display: block; }
details.pipes { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px;
  margin-bottom: 14px; }
details.pipes summary { cursor: pointer; }
table { border-collapse: collapse; width: 100%; margin-top: 8px; }
td, th { text-align: left; padding: 4px 8px; border-top: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 13px; }
.state-ok { color: var(--ok); } .state-missing, .state-error { color: var(--err); }
.banner { border-radius: 8px; padding: 8px 14px; margin-bottom: 10px; }
.banner.err { background: var(--err-bg); color: var(--err); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
h2 { font-size: 16px; margin: 22px 0 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px;
  margin-bottom: 12px; }
.card.escalation { border-left: 4px solid var(--esc); }
.card h3 { margin: 0 0 4px; font-size: 15px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.chip { display: inline-block; background: var(--chip); border-radius: 10px; padding: 0 8px; font-size: 12px;
  color: var(--text); margin-right: 4px; }
.chip.esc { background: var(--esc-bg); color: var(--esc); font-weight: 600; }
.body { margin-top: 8px; overflow-wrap: anywhere; }
.body pre { background: var(--code); padding: 8px 10px; border-radius: 6px; overflow-x: auto; }
.body code { background: var(--code); padding: 0 4px; border-radius: 4px; font-size: 13px; }
.body pre code { background: none; padding: 0; }
.body h4 { margin: 10px 0 4px; font-size: 14px; }
.body p { margin: 6px 0; }
.body ul, .body ol { margin: 6px 0; padding-left: 22px; }
details.history { margin-top: 8px; }
details.history summary { cursor: pointer; font-size: 13px; color: var(--muted); }
.event { border-top: 1px dashed var(--line); padding: 6px 0; }
.answer { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.answer textarea { width: 100%; min-height: 70px; font: inherit; padding: 6px 8px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); resize: vertical; }
.answer .buttons { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
.note { font-size: 12px; color: var(--muted); margin-top: 6px; }
.result { font-size: 13px; margin-top: 6px; white-space: pre-wrap; }
.result.ok { color: var(--ok); } .result.err { color: var(--err); } .result.warn { color: var(--warn); }
.empty { color: var(--muted); padding: 6px 0 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.filters select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel); color: var(--text); }
button.btn.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.summary { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px;
  margin-bottom: 10px; }
table.hist { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
table.hist tr.row { cursor: pointer; }
table.hist tr.row:hover { background: var(--chip); }
table.hist tr.sessions > td { background: var(--bg); padding: 4px 14px 10px; }
table.hist .tw { white-space: nowrap; }
.badge { display: inline-block; border-radius: 10px; padding: 0 8px; font-size: 12px; font-weight: 600;
  white-space: nowrap; }
.badge.r-accepted { background: #d9f2e1; color: #17612e; }
.badge.r-in-review { background: #dde7fb; color: #1f4aa8; }
.badge.r-returned { background: #ffe8cc; color: #8a4b00; }
.badge.r-open { background: var(--chip); color: var(--text); }
.badge.r-declined { background: var(--err-bg); color: var(--err); }
.badge.r-unknown { background: none; color: var(--muted); border: 1px solid var(--line); }
.badge.esc { background: var(--esc-bg); color: var(--esc); margin-left: 4px; }
.arrow { display: inline-block; width: 14px; color: var(--muted); }
.card.now h3 { display: flex; align-items: center; gap: 10px; }
.badge.s-running { background: #d9f2e1; color: #17612e; }
.badge.s-not-running { background: var(--chip); color: var(--muted); }
.badge.s-unknown { background: var(--warn-bg); color: var(--warn); }
.badge.goal { background: #dde7fb; color: #1f4aa8; }
.now-line { font-size: 14px; margin-top: 4px; }
.card.now table { font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>radark cockpit</h1>
  <nav>
    <button class="active" data-tab="owner">Owner</button>
    <button data-tab="history">History</button>
    <button data-tab="now">Now</button>
  </nav>
  <span class="spacer"></span>
  <span class="muted small" id="refreshed"></span>
  <button class="btn" id="refresh">Refresh</button>
</header>
<main>
  <section class="tab active" id="tab-owner">
    <div id="banners"></div>
    <details class="pipes" id="pipes"><summary id="pipes-summary">Pipelines</summary><div id="pipes-body"></div></details>
    <h2 id="pending-title">Pending</h2>
    <div id="pending"></div>
    <h2 id="done-title">Done</h2>
    <div id="done"></div>
    <div id="done-more"></div>
  </section>
  <section class="tab" id="tab-history">
    <div class="filters">
      <select id="h-pipeline"><option value="">All pipelines</option></select>
      <span id="h-periods">
        <button class="btn on" data-period="last-run">Last run</button>
        <button class="btn" data-period="24h">Last 24 h</button>
        <button class="btn" data-period="7d">Last 7 days</button>
        <button class="btn" data-period="all">All</button>
      </span>
    </div>
    <div id="h-notes"></div>
    <div class="summary" id="h-summary">Loading...</div>
    <table class="hist">
      <thead><tr><th></th><th>Pipeline</th><th>ID</th><th>Title</th><th>Team</th><th>First start</th><th>Last end</th>
        <th>Total</th><th>Result</th></tr></thead>
      <tbody id="h-rows"></tbody>
    </table>
  </section>
  <section class="tab" id="tab-now">
    <div class="summary" id="n-machine">Loading...</div>
    <div id="n-cards"></div>
  </section>
</main>
<script>
"use strict";
const REFRESH_MS = 30000;
const DONE_FIRST = 20;
const LABELS = {respond: "Respond", done: "Done", ack: "Acknowledge", decline: "Decline"};
const NEEDS_TEXT = {respond: true, decline: true};
let note = "";
let showAllDone = false;
let loading = false;

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function inline(t) {
  // `t` is already escaped; code spans are taken out first so nothing inside them is formatted
  const codes = [];
  t = t.replace(/`([^`]+)`/g, function (m, c) { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, function (m, text, url) {
    return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + text + "</a>";
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\u0000(\d+)\u0000/g, function (m, i) { return "<code>" + codes[Number(i)] + "</code>"; });
  return t;
}

function md(src) {
  const lines = esc(src).split(/\r?\n/);  // escaped first, then the minimal Markdown subset
  const out = [];
  let para = [], list = null, fence = null;
  function flushPara() { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } }
  function flushList() { if (list) { out.push("<" + list.tag + ">" + list.items.map(function (x) {
    return "<li>" + inline(x) + "</li>"; }).join("") + "</" + list.tag + ">"); list = null; } }
  for (const line of lines) {
    if (fence !== null) {
      if (/^\s*```/.test(line)) { out.push("<pre><code>" + fence.join("\n") + "</code></pre>"); fence = null; }
      else fence.push(line);
      continue;
    }
    if (/^\s*```/.test(line)) { flushPara(); flushList(); fence = []; continue; }
    let m = /^\s*(#{1,6})\s+(.*)$/.exec(line);
    if (m) { flushPara(); flushList(); out.push("<h4>" + inline(m[2]) + "</h4>"); continue; }
    m = /^\s*([-*]|\d+\.)\s+(.*)$/.exec(line);
    if (m) {
      flushPara();
      const tag = /\d/.test(m[1]) ? "ol" : "ul";
      if (list && list.tag !== tag) flushList();
      if (!list) list = {tag: tag, items: []};
      list.items.push(m[2]);
      continue;
    }
    if (!line.trim()) { flushPara(); flushList(); continue; }
    flushList();
    para.push(line);
  }
  if (fence !== null) out.push("<pre><code>" + fence.join("\n") + "</code></pre>");
  flushPara(); flushList();
  return out.join("");
}

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "text") e.textContent = attrs[k];
    else if (k === "cls") e.className = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of (children || [])) if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  return e;
}

function when(iso) {
  if (!iso) return el("span", {text: "-"});
  const d = new Date(iso);
  if (isNaN(d)) return el("span", {text: String(iso)});
  const s = Math.round((Date.now() - d.getTime()) / 1000);
  let rel;
  if (s < 60) rel = "just now";
  else if (s < 3600) rel = Math.floor(s / 60) + " min ago";
  else if (s < 86400) rel = Math.floor(s / 3600) + " h ago";
  else rel = Math.floor(s / 86400) + " d ago";
  return el("span", {text: rel, title: d.toLocaleString()});
}

async function api(method, path, body) {
  const opts = {method: method, headers: {}};
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const resp = await fetch(path, opts);
  let data = {};
  try { data = await resp.json(); } catch (e) { data = {ok: false, error: "no JSON answer (" + resp.status + ")"}; }
  return {status: resp.status, data: data};
}

function cardKey(it) { return it.hub_key + "|" + it.id; }

function busyCard(card) {
  // an answer being typed is never replaced by a refresh
  const ta = card && card.querySelector("textarea");
  return !!(ta && (ta.value.trim() || document.activeElement === ta));
}

function renderBody(box, it) {
  box.textContent = "";
  if (it.partial) {
    const btn = el("button", {cls: "btn", text: "Load the text"});
    btn.addEventListener("click", async function () {
      btn.disabled = true;
      const r = await api("GET", "/api/item?hub_key=" + encodeURIComponent(it.hub_key) + "&id=" +
        encodeURIComponent(it.id));
      if (r.data.ok) { Object.assign(it, r.data.item); renderBody(box, it); }
      else { btn.disabled = false; box.appendChild(el("div", {cls: "result err", text: r.data.error || "failed"})); }
    });
    box.appendChild(el("div", {cls: "muted small", text: it.show_error ? "Not loaded: " + it.show_error : ""}));
    box.appendChild(btn);
    return;
  }
  const body = el("div", {cls: "body"});
  body.innerHTML = md(it.body);  // md() escapes before formatting
  box.appendChild(body);
  if (it.events && it.events.length) {
    const hist = el("details", {cls: "history"}, [el("summary", {text: "History (" + it.events.length + ")"})]);
    for (const e of it.events) {
      const ev = el("div", {cls: "event"}, [
        el("div", {cls: "meta"}, [el("strong", {text: e.team || "?"}), el("span", {text: e.type || ""}), when(e.at)]),
      ]);
      const b = el("div", {cls: "body"});
      b.innerHTML = md(e.body);
      ev.appendChild(b);
      hist.appendChild(ev);
    }
    box.appendChild(hist);
  }
}

function card(it) {
  const c = el("div", {cls: "card" + (it.escalation ? " escalation" : ""), "data-key": cardKey(it)});
  const tags = el("span");
  if (it.escalation) tags.appendChild(el("span", {cls: "chip esc", text: "escalation"}));
  for (const t of it.tags || []) if (t !== "escalation") tags.appendChild(el("span", {cls: "chip", text: t}));
  const pipes = el("span");
  for (const p of it.pipelines || []) pipes.appendChild(el("span", {cls: "chip", text: p}));
  c.appendChild(el("h3", {text: it.title || it.id}));
  c.appendChild(el("div", {cls: "meta"}, [
    pipes, tags,
    el("span", {}, ["from ", el("strong", {text: it.from || "?"})]),
    el("span", {text: "expects " + (it.expects || "?")}),
    el("span", {}, ["created ", when(it.created)]),
    el("span", {}, ["last activity ", when(it.last_activity)]),
    el("span", {text: it.id}),
    it.pending ? null : el("span", {text: [it.my_state, it.status].filter(Boolean).join(", ")}),
  ]));
  const box = el("div");
  renderBody(box, it);
  c.appendChild(box);
  if (it.pending) c.appendChild(answerArea(it));
  return c;
}

function answerArea(it) {
  const area = el("div", {cls: "answer"});
  const allowed = it.allowed || [];
  const result = el("div", {cls: "result"});
  if (!allowed.length) {
    area.appendChild(el("div", {cls: "muted small", text: it.partial ? "Load the text to answer." :
      "No answer is possible from the owner now."}));
    return area;
  }
  const ta = el("textarea", {placeholder: "Answer, note or reason"});
  const buttons = el("div", {cls: "buttons"});
  for (const action of allowed) {
    const b = el("button", {cls: "btn" + (action === "respond" || action === "done" ? " primary" : ""),
      text: LABELS[action] || action});
    b.addEventListener("click", async function () {
      const text = ta.value;
      if (NEEDS_TEXT[action] && !text.trim()) {
        result.className = "result err";
        result.textContent = (LABELS[action] || action) + " needs a text.";
        return;
      }
      for (const x of buttons.querySelectorAll("button")) x.disabled = true;
      result.className = "result"; result.textContent = "Sending...";
      let r;
      try { r = await api("POST", "/api/action", {hub_key: it.hub_key, id: it.id, action: action, text: text}); }
      catch (e) { r = {status: 0, data: {ok: false, error: String(e)}}; }
      if (r.data.ok) {
        ta.value = "";
        result.className = r.data.warning ? "result warn" : "result ok";
        result.textContent = "Done: " + action + (r.data.warning ? "\n" + r.data.warning : "");
        await load();
      } else {
        result.className = "result err";
        let msg = r.data.error || ("failed (" + r.status + ")");
        if (r.data.allowed) msg += " (allowed now: " + (r.data.allowed.join(", ") || "none") + ")";
        result.textContent = msg;
        for (const x of buttons.querySelectorAll("button")) x.disabled = false;
      }
    });
    buttons.appendChild(b);
  }
  area.appendChild(ta);
  area.appendChild(buttons);
  area.appendChild(el("div", {cls: "note", text: note}));
  area.appendChild(result);
  return area;
}

function renderList(container, items, limit) {
  const old = {};
  for (const c of container.querySelectorAll(".card")) old[c.getAttribute("data-key")] = c;
  const frag = document.createDocumentFragment();
  const shown = limit ? items.slice(0, limit) : items;
  for (const it of shown) {
    const prev = old[cardKey(it)];
    frag.appendChild(busyCard(prev) ? prev : card(it));
  }
  container.textContent = "";
  if (!items.length) container.appendChild(el("div", {cls: "empty", text: "Nothing here."}));
  container.appendChild(frag);
}

function renderPipelines(pipes) {
  const body = document.getElementById("pipes-body");
  body.textContent = "";
  const bad = pipes.filter(function (p) { return p.state !== "ok"; }).length;
  document.getElementById("pipes-summary").textContent = "Pipelines (" + pipes.length + ")" +
    (bad ? " - " + bad + " not readable" : "");
  if (!pipes.length) {
    body.appendChild(el("div", {cls: "empty", text: "No pipeline known yet: run one, or start the cockpit with --config."}));
    return;
  }
  const table = el("table", {}, [el("tr", {}, [el("th", {text: "Name"}), el("th", {text: "Configuration"}),
    el("th", {text: "State"}), el("th")])]);
  for (const p of pipes) {
    const action = el("td");
    if (p.state === "missing" && p.registered) {
      const b = el("button", {cls: "btn", text: "Forget"});
      b.addEventListener("click", async function () {
        b.disabled = true;
        const r = await api("POST", "/api/forget", {config: p.config});
        if (!r.data.ok) { b.disabled = false; action.appendChild(el("div", {cls: "result err", text: r.data.error})); }
        else await load();
      });
      action.appendChild(b);
    }
    table.appendChild(el("tr", {}, [el("td", {text: p.name}), el("td", {cls: "small", text: p.config}),
      el("td", {cls: "state-" + p.state, text: p.state + (p.message ? ": " + p.message : "")}), action]));
  }
  body.appendChild(table);
  if (bad) document.getElementById("pipes").open = true;
}

function render(data) {
  note = data.note || "";
  const banners = document.getElementById("banners");
  banners.textContent = "";
  if (data.registry_problem) banners.appendChild(el("div", {cls: "banner warn", text: data.registry_problem}));
  for (const h of data.hubs || []) {
    if (h.error) banners.appendChild(el("div", {cls: "banner err",
      text: "Hub of " + h.pipelines.join(", ") + " could not be read: " + h.error}));
  }
  renderPipelines(data.pipelines || []);
  document.getElementById("pending-title").textContent = "Pending (" + data.pending.length + ")";
  document.getElementById("done-title").textContent = "Done (" + data.done.length + ")";
  renderList(document.getElementById("pending"), data.pending, 0);
  renderList(document.getElementById("done"), data.done, showAllDone ? 0 : DONE_FIRST);
  const more = document.getElementById("done-more");
  more.textContent = "";
  if (!showAllDone && data.done.length > DONE_FIRST) {
    const b = el("button", {cls: "btn", text: "Show all " + data.done.length});
    b.addEventListener("click", function () { showAllDone = true; render(data); });
    more.appendChild(b);
  }
}

async function load() {
  if (loading) return;
  loading = true;
  const btn = document.getElementById("refresh");
  btn.disabled = true;
  try {
    const r = await api("GET", "/api/items");
    if (r.status === 200) {
      render(r.data);
      document.getElementById("refreshed").textContent = "updated " + new Date().toLocaleTimeString();
    } else {
      document.getElementById("refreshed").textContent = "refresh failed: " + (r.data.error || r.status);
    }
  } catch (e) {
    document.getElementById("refreshed").textContent = "cockpit not reachable: " + e;
  } finally {
    loading = false;
    btn.disabled = false;
  }
}

// ---- History of finished work (cockpit-history H8): every text is set with textContent
const ARROW_OPEN = "▾", ARROW_SHUT = "▸";
let activeTab = "owner";
let histPeriod = "last-run";
let histLoading = false;
const histOpen = {};  // "pipeline|id" -> true for rows kept expanded across refreshes
const histNames = [];

function dur(s) {
  if (s == null) return "-";
  if (s < 60) return "< 1 min";
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? h + " h " + String(m).padStart(2, "0") + " min" : String(m).padStart(2, "0") + " min";
}

function local(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  return isNaN(d) ? String(iso) : d.toLocaleString();
}

function histSessions(r) {
  const t = el("table", {}, [el("tr", {}, ["Phase", "Team", "Start", "End", "Duration", "Outcome", ""].map(
    function (h) { return el("th", {text: h}); }))]);
  for (const s of r.sessions) {
    const counts = [];
    if (s.denials) counts.push(s.denials + " denial" + (s.denials === 1 ? "" : "s"));
    if (s.escalations) counts.push(s.escalations + " escalation" + (s.escalations === 1 ? "" : "s"));
    t.appendChild(el("tr", {}, [
      el("td", {text: s.phase || "?"}), el("td", {text: s.team || "?"}),
      el("td", {cls: "tw", text: local(s.start)}),
      el("td", {cls: "tw", text: s.running ? "running since " + local(s.start) : local(s.end)}),
      el("td", {cls: "tw", text: s.running ? "-" : dur(s.duration_s)}),
      el("td", {text: s.running ? "running" : (s.outcome || "?")}),
      el("td", {cls: "small muted", text: counts.join(", ")}),
    ]));
  }
  return t;
}

function histRow(r, body) {
  const key = r.pipeline + "|" + r.id;
  const arrow = el("span", {cls: "arrow", text: histOpen[key] ? ARROW_OPEN : ARROW_SHUT});
  const result = el("td", {}, [el("span", {cls: "badge r-" + r.result.replace(/ /g, "-"), text: r.result})]);
  if (r.escalated) result.appendChild(el("span", {cls: "badge esc", text: "escalated"}));
  const row = el("tr", {cls: "row"}, [
    el("td", {}, [arrow]), el("td", {text: r.pipeline}), el("td", {cls: "tw small", text: r.id}),
    el("td", {text: r.title}), el("td", {text: r.teams.join(", ")}),
    el("td", {cls: "tw", text: local(r.first_start)}),
    el("td", {cls: "tw", text: r.running && !r.last_end ? "running" : local(r.last_end)}),
    el("td", {cls: "tw", text: "working " + dur(r.working_s) + " / wall " + dur(r.wall_s)}),
    result,
  ]);
  const detail = el("tr", {cls: "sessions"}, [el("td", {colspan: "9"}, [histSessions(r)])]);
  detail.hidden = !histOpen[key];
  row.addEventListener("click", function () {
    histOpen[key] = !histOpen[key];
    detail.hidden = !histOpen[key];
    arrow.textContent = histOpen[key] ? ARROW_OPEN : ARROW_SHUT;
  });
  body.appendChild(row);
  body.appendChild(detail);
}

function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

function renderHistory(data) {
  const select = document.getElementById("h-pipeline");
  for (const p of data.pipelines || []) {
    if (histNames.indexOf(p.name) < 0) {
      histNames.push(p.name);
      select.appendChild(el("option", {value: p.name, text: p.name}));
    }
  }
  const notes = document.getElementById("h-notes");
  notes.textContent = "";
  for (const p of data.pipelines || []) {
    if (p.hub_error) notes.appendChild(el("div", {cls: "banner warn",
      text: "Hub of " + p.name + " could not be read (results unknown): " + p.hub_error}));
    if (p.log === "missing") notes.appendChild(el("div", {cls: "muted small", text: p.name + ": no run log yet."}));
    if (p.log === "error") notes.appendChild(el("div", {cls: "banner err", text: p.name + ": run log not readable."}));
    if (p.skipped) notes.appendChild(el("div", {cls: "muted small",
      text: p.name + ": " + plural(p.skipped, "unreadable run log line") + " skipped."}));
  }
  const s = data.summary;
  document.getElementById("h-summary").textContent = plural(s.handovers, "handover") + ", " +
    plural(s.sessions, "session") + ", working " + dur(s.working_s) + ", " + s.accepted + " accepted; " +
    plural(s.other_sessions, "session") + " without a handover, " + dur(s.other_s);
  const body = document.getElementById("h-rows");
  body.textContent = "";
  if (!data.rows.length) body.appendChild(el("tr", {}, [el("td", {colspan: "9", cls: "empty",
    text: "No work in this period."})]));
  for (const r of data.rows) histRow(r, body);
}

async function loadHistory() {
  if (histLoading) return;
  histLoading = true;
  const btn = document.getElementById("refresh");
  btn.disabled = true;
  const pipe = document.getElementById("h-pipeline").value;
  let path = "/api/history?period=" + encodeURIComponent(histPeriod);
  if (pipe) path += "&pipeline=" + encodeURIComponent(pipe);
  try {
    const r = await api("GET", path);
    if (r.status === 200) {
      renderHistory(r.data);
      document.getElementById("refreshed").textContent = "updated " + new Date().toLocaleTimeString();
    } else {
      document.getElementById("refreshed").textContent = "refresh failed: " + (r.data.error || r.status);
    }
  } catch (e) {
    document.getElementById("refreshed").textContent = "cockpit not reachable: " + e;
  } finally {
    histLoading = false;
    btn.disabled = false;
  }
}

// ---- Now: the current state of the pipelines (cockpit-now N9); every text is set with textContent
const NOW_REFRESH_MS = 10000;
let nowLoading = false;

function nowLine(label, value) {
  return el("div", {cls: "now-line"}, [el("span", {cls: "muted", text: label + " "}), el("span", {text: value})]);
}

function nowSessions(c) {
  const t = el("table", {}, [el("tr", {}, ["Team", "ID", "Title", "Phase", "Since", "For", ""].map(
    function (h) { return el("th", {text: h}); }))]);
  for (const s of c.running) {
    t.appendChild(el("tr", {}, [
      el("td", {text: s.team || "?"}), el("td", {cls: "tw small", text: s.handover || "—"}),
      el("td", {text: s.handover ? (s.title || "unknown") : "—"}), el("td", {text: s.phase || "?"}),
      el("td", {cls: "tw", text: local(s.start)}),
      el("td", {cls: "tw", text: s.state === "running" ? dur(s.elapsed_s) : "-"}),
      el("td", {cls: "small muted", text: s.state}),
    ]));
  }
  return t;
}

function nowCard(c) {
  const box = el("div", {cls: "card now"});
  box.appendChild(el("h3", {}, [el("span", {text: c.name}),
    el("span", {cls: "badge s-" + c.state.replace(/ /g, "-"), text: c.state})]));
  if (c.message) box.appendChild(el("div", {cls: "banner warn", text: c.message}));
  for (const i of c.instances || []) {
    box.appendChild(nowLine("Instance", "since " + local(i.started) + " · PID " + (i.pid == null ? "?" : i.pid) +
      " · " + plural(i.sessions, "session slot")));
  }
  if (c.state === "running") {
    box.appendChild(c.goal ? el("div", {cls: "now-line"}, [el("span", {cls: "badge goal", text: "Goal run"}),
      el("span", {text: " " + (c.goal.name || "?") + " since " + local(c.goal.started)})])
      : nowLine("", "Regular run"));
  }
  if (c.running && c.running.length) {
    box.appendChild(el("div", {cls: "now-line muted", text: c.state === "running" ?
      "Sessions running now (" + c.running.length + ")" : "Interrupted sessions (" + c.running.length + ")"}));
    box.appendChild(nowSessions(c));
  } else if (c.state === "running") {
    box.appendChild(nowLine("", "No session running now."));
  }
  if (c.log === "missing") box.appendChild(nowLine("", "No run log yet."));
  if (c.last_event) box.appendChild(nowLine("Last event:", c.last_event.event + " at " + local(c.last_event.time)));
  if (c.state === "not running") {
    const s = c.last_session;
    if (s) box.appendChild(nowLine("Last session:", (s.outcome || "?") + " at " + local(s.end) + " (" +
      [s.team, s.handover, s.phase].filter(Boolean).join(", ") + ")"));
    if (c.last_start) {
      box.appendChild(nowLine("Last start:", local(c.last_start)));
      box.appendChild(nowLine("Stop:", c.last_stop ? local(c.last_stop) : "not recorded"));
    }
    const g = c.last_goal;
    if (g) box.appendChild(nowLine("Last goal run:", (g.name || "?") + ", " + (g.status === "running" ?
      "not finished" : (g.status || "?")) + (g.ended ? ", ended " + local(g.ended) : "")));
  }
  if (c.hub_error) box.appendChild(el("div", {cls: "muted small", text: "Hub not readable, titles unknown: " +
    c.hub_error}));
  return box;
}

function renderNow(data) {
  const m = data.machine;
  let line = "Session slots " + m.slots_used + " / " + m.slots_limit + " · " +
    plural(m.running, "pipeline") + " running";
  if (m.other_instances) line += " · " + plural(m.other_instances, "other instance");
  if (m.unknown_instances) line += " · " + plural(m.unknown_instances, "instance") + " unknown";
  if (m.note) line += " · " + m.note;
  document.getElementById("n-machine").textContent = line;
  const cards = document.getElementById("n-cards");
  cards.textContent = "";
  if (!data.pipelines.length) cards.appendChild(el("div", {cls: "empty",
    text: "No pipeline known yet: run one, or start the cockpit with --config."}));
  for (const c of data.pipelines) cards.appendChild(nowCard(c));
}

async function loadNow() {
  if (nowLoading) return;
  nowLoading = true;
  const btn = document.getElementById("refresh");
  btn.disabled = true;
  try {
    const r = await api("GET", "/api/now");
    if (r.status === 200) {
      renderNow(r.data);
      document.getElementById("refreshed").textContent = "updated " + new Date().toLocaleTimeString();
    } else {
      document.getElementById("refreshed").textContent = "refresh failed: " + (r.data.error || r.status);
    }
  } catch (e) {
    document.getElementById("refreshed").textContent = "cockpit not reachable: " + e;
  } finally {
    nowLoading = false;
    btn.disabled = false;
  }
}

function showTab(name) {
  activeTab = name;
  for (const b of document.querySelectorAll("nav button[data-tab]")) {
    b.classList.toggle("active", b.dataset.tab === name);
  }
  for (const t of document.querySelectorAll("section.tab")) t.classList.toggle("active", t.id === "tab-" + name);
  refreshActive();
}

function refreshActive() {
  if (activeTab === "history") loadHistory(); else if (activeTab === "now") loadNow(); else load();
}

for (const b of document.querySelectorAll("nav button[data-tab]")) {
  b.addEventListener("click", function () { showTab(b.dataset.tab); });
}
for (const b of document.querySelectorAll("#h-periods button")) {
  b.addEventListener("click", function () {
    histPeriod = b.dataset.period;
    for (const x of document.querySelectorAll("#h-periods button")) x.classList.toggle("on", x === b);
    loadHistory();
  });
}
document.getElementById("h-pipeline").addEventListener("change", loadHistory);
document.getElementById("refresh").addEventListener("click", refreshActive);
setInterval(function () { if (activeTab !== "now") refreshActive(); }, REFRESH_MS);
setInterval(function () { if (activeTab === "now") loadNow(); }, NOW_REFRESH_MS);
load();
</script>
</body>
</html>
